# CI/CD for omnimap-front service
#
# Triggers deployment via helm repo (GitOps)
# Actual build and deploy logic is in omnimap-helm repo

name: CI/CD Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Trigger Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger helm repo deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            https://gitverse.ru/api/v1/repos/PavelNikolaeW/omnimap-helm/dispatches \
            -d '{
              "event_type": "deploy-frontend",
              "client_payload": {
                "branch": "main",
                "commit": "${{ steps.commit.outputs.sha }}",
                "short_commit": "${{ steps.commit.outputs.short_sha }}",
                "triggered_by": "omnimap-front"
              }
            }'
          echo "Triggered deploy-frontend in omnimap-helm"
