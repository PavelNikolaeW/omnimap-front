# CI/CD for omnimap-front service
#
# Triggers deployment via helm repo (GitOps)
# Actual build and deploy logic is in omnimap-helm repo

name: CI/CD Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy:
    name: Trigger Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger helm repo deploy
        run: |
          # GitVerse API: workflow_dispatch via API
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            "https://gitverse.ru/api/v1/repos/PavelNikolaeW/omnimap-helm/actions/workflows/deploy-frontend.yml/dispatches" \
            -d '{
              "ref": "main",
              "inputs": {
                "branch": "main",
                "commit": "${{ steps.commit.outputs.sha }}"
              }
            }'
          echo "Triggered deploy-frontend.yml in omnimap-helm"
