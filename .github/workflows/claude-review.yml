name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Fast checks (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          echo "== install =="
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm i --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          else npm i
          fi

          echo "== lint/typecheck/test (if exists) =="
          npm run -s lint || true
          npm run -s typecheck || true
          npm run -s test || true
          npm run -s build || true

      - name: PR Review (strict)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-20250514
            --max-turns 25
            --allowedTools "Read" "Glob" "Grep" "Bash(gh pr:*)" "Bash(gh api:*)" "Bash(git:*)" "Bash(npm:*)" "Bash(pnpm:*)" "Bash(yarn:*)"
          prompt: |
            You are a STRICT PR reviewer for a JS/TS frontend (webpack, jest/playwright). No rubber-stamp.

            Required workflow:
            1) Run: gh pr diff ${{ github.event.pull_request.number }}
            2) Run: gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
            3) Read all modified files and any referenced code.

            Mandatory checks:
            - Correctness: state management, async race conditions, DOM event handling, data flow, error handling
            - Security: XSS, unsafe innerHTML, injection into templates, leaking tokens in logs
            - Performance: unnecessary re-renders, heavy loops, large JSON ops, expensive layout thrash
            - Test impact: jest/playwright assertions, flaky patterns, timeouts

            Review rules:
            - Always leave a review comment.
            - If ANY correctness/security risk OR you are not confident (missing context/tests), use REQUEST_CHANGES.
            - Every issue must include: file path + exact snippet/line context + why + concrete fix.

            Output format:
            1) Summary (1-3 bullets)
            2) High-risk issues (if any)
            3) Medium/low issues
            4) Suggested tests to add (>=1)
            5) If LGTM: explicitly list what you checked and why safe.

            Then submit:
            - REQUEST_CHANGES if needed, otherwise COMMENT (do not APPROVE).
            Use:
              gh pr review ${{ github.event.pull_request.number }} --request-changes -b "<body>"
              OR
              gh pr review ${{ github.event.pull_request.number }} --comment -b "<body>"
