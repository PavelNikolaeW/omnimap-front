<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>omniMap</title>
    <!-- Runtime config - with offline fallback -->
    <script>
        // Default config for offline mode
        window.__OMNIMAP_CONFIG__ = window.__OMNIMAP_CONFIG__ || {
            APP_BACKEND_URL: 'https://omnimap.ru',
            LLM_GATEWAY_URL: 'https://llm.omnimap.ru',
            SINC_SERVICE_URL: 'wss://omnimap.ru/ws'
        };
        // Flag to track if external config loaded
        window.__OMNIMAP_CONFIG_LOADED__ = false;
    </script>
    <script id="config-script" src="/config/config.js"></script>
    <script>
        // Check if config was loaded (CSP-safe approach instead of inline onerror)
        document.getElementById('config-script').addEventListener('error', function() {
            console.log('Config not loaded, using defaults');
        });
        document.getElementById('config-script').addEventListener('load', function() {
            window.__OMNIMAP_CONFIG_LOADED__ = true;
        });
    </script>
    <style>
        /* Inline стили для загрузочного экрана - предотвращают FOUC */
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.3s ease-out;
        }
        #app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loader-text {
            margin-top: 16px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #666;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Скрываем основной контент до загрузки */
        .layout {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .layout.loaded {
            opacity: 1;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            if (isMobile) {
                meta.content = 'width=device-width, initial-scale=0.75, maximum-scale=1.0, viewport-fit=cover';
            } else {
                meta.content = 'width=device-width, initial-scale=1.0';
            }
            document.head.appendChild(meta);
        });
    </script>
</head>
<body>

<!-- Загрузочный экран -->
<div id="app-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Загрузка...</div>
</div>

<main class="layout">
    <div class="top-navigation" id="topSidebar">
        <div class="active-button-info" id="active-button-info">openBlock</div>
        <div class="tree-navigation" id="tree-navigation"></div>
        <div class="top-btn-container" id="top-btn-container"></div>
    </div>
    <div class="content-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content" id="control-panel"></div>
        </aside>
        <div class="container-blocks" id="rootContainer">
            <!-- Содержимое основного блока -->
        </div>
    </div>
    <nav class="breadcrumb-nav" id="breadcrumb">
    </nav>
</main>

<template id="access-window-template">
    <div class="access-window">
        <h3 id="access-window-title">Редактирование прав доступа</h3>
        <button class="close-button">×</button>
        <div class="loading">Загрузка...</div>

        <div class="content" style="display: none;">
            <label>
                <input type="checkbox" id="public-checkbox">
                Сделать публичным
            </label>

            <label for="username-input">Имя пользователя для доступа:</label>
            <input type="text" id="username-input"/>

            <label for="access-level">Уровень доступа:</label>
            <select id="access-level">
                <option value="deny">Запретить</option>
                <option value="view">Только чтение</option>
                <option value="edit">Чтение и редактирование</option>
                <option value="edit_ac">Чтение и редактирование прав</option>
                <option value="delete">Удаление</option>
            </select>

            <button id="confirm-button">Подтвердить</button>

            <div class="user-list">
                <h4>Пользователи с доступом:</h4>
                <div id="user-list"></div>
            </div>
        </div>
    </div>
</template>


<div id="editor-container">
</div>


<div class="container-iframe" id="container-iframe"></div>
<div id="error-popup" class="hidden">
    <span id="error-message"></span>
</div>

<div class="diagram-inputs hidden" id="diagram-inputs">


    <label>Connections
        <input type="checkbox" id="CerateConnections" name="create" value="create">
    </label>

    <label for="sizeSelector">Size</label>
    <select id="sizeSelector">
        <option value="-">-</option>
        <option value="default">default</option>
        <option value="xs">xs</option>
        <option value="s">s</option>
        <option value="m">m</option>
        <option value="l">l</option>
    </select>

    <button class="diagram-btn fas fa-plus-square fas-lg" id="addDiagram" title="Add block"></button>
    <button class="diagram-btn fas fa-palette fas-lg" id="openStylePanel" title="Block styles"></button>
    <button class="diagram-btn fas fa-bezier-curve fas-lg" id="openConnectionPanel" title="Connections"></button>
    <button class="diagram-btn fas fa-rotate fas-lg" id="reset" title="Reset grid"></button>
</div>

<!-- Block Style Panel -->
<div class="block-style-panel" id="blockStylePanel">
    <h4>Block Style</h4>

    <!-- Tabs for basic/advanced -->
    <div class="style-tabs">
        <button class="style-tab active" data-tab="basic">Basic</button>
        <button class="style-tab" data-tab="advanced">Advanced</button>
    </div>

    <!-- Basic Tab -->
    <div class="style-tab-content active" id="tab-basic">
        <div class="style-row">
            <label>Background</label>
            <input type="color" id="styleBackground" value="#ffffff">
        </div>
        <div class="style-row">
            <label>Border Color</label>
            <input type="color" id="styleBorderColor" value="#e5e7eb">
        </div>
        <div class="style-row">
            <label>Border</label>
            <select id="styleBorder">
                <option value="">None</option>
                <option value="thin">Thin (1px)</option>
                <option value="medium">Medium (2px)</option>
                <option value="thick">Thick (3px)</option>
                <option value="dashed">Dashed</option>
                <option value="dotted">Dotted</option>
                <option value="double">Double</option>
            </select>
        </div>
        <div class="style-row">
            <label>Shape</label>
            <select id="styleShape">
                <option value="">Default (Rectangle)</option>
                <option value="rounded">Rounded</option>
                <option value="pill">Pill (Capsule)</option>
                <option value="diamond">Diamond</option>
                <option value="hexagon">Hexagon</option>
                <option value="parallelogram">Parallelogram</option>
                <option value="trapezoid">Trapezoid</option>
                <option value="cylinder">Cylinder (Database)</option>
                <option value="document">Document</option>
                <option value="ellipse">Ellipse</option>
            </select>
        </div>
        <div class="style-row">
            <label>Shadow</label>
            <select id="styleShadow">
                <option value="">None</option>
                <option value="sm">Small</option>
                <option value="md">Medium</option>
                <option value="lg">Large</option>
                <option value="xl">Extra Large</option>
                <option value="inner">Inner Shadow</option>
            </select>
        </div>
        <div class="style-presets">
            <div class="style-preset style-preset-default" data-preset="default" title="Default"></div>
            <div class="style-preset style-preset-blue" data-preset="blue" title="Blue"></div>
            <div class="style-preset style-preset-green" data-preset="green" title="Green"></div>
            <div class="style-preset style-preset-yellow" data-preset="yellow" title="Yellow"></div>
            <div class="style-preset style-preset-red" data-preset="red" title="Red"></div>
            <div class="style-preset style-preset-purple" data-preset="purple" title="Purple"></div>
            <div class="style-preset style-preset-pink" data-preset="pink" title="Pink"></div>
            <div class="style-preset style-preset-gray" data-preset="gray" title="Gray"></div>
        </div>

        <!-- Shape Presets for Diagrams -->
        <div class="style-section">
            <label class="style-section-label">Diagram Shapes</label>
            <div class="shape-presets">
                <div class="shape-preset" data-shape="process" title="Процесс">
                    <div class="shape-preview shape-preview-process"></div>
                    <span>Процесс</span>
                </div>
                <div class="shape-preset" data-shape="decision" title="Решение">
                    <div class="shape-preview shape-preview-decision"></div>
                    <span>Решение</span>
                </div>
                <div class="shape-preset" data-shape="data" title="Данные">
                    <div class="shape-preview shape-preview-data"></div>
                    <span>Данные</span>
                </div>
                <div class="shape-preset" data-shape="database" title="База данных">
                    <div class="shape-preview shape-preview-database"></div>
                    <span>БД</span>
                </div>
                <div class="shape-preset" data-shape="document" title="Документ">
                    <div class="shape-preview shape-preview-document"></div>
                    <span>Документ</span>
                </div>
                <div class="shape-preset" data-shape="terminal" title="Начало/Конец">
                    <div class="shape-preview shape-preview-terminal"></div>
                    <span>Терминал</span>
                </div>
                <div class="shape-preset" data-shape="manual" title="Ручной ввод">
                    <div class="shape-preview shape-preview-manual"></div>
                    <span>Ввод</span>
                </div>
                <div class="shape-preset" data-shape="subprocess" title="Подпроцесс">
                    <div class="shape-preview shape-preview-subprocess"></div>
                    <span>Подпроцесс</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Advanced Tab -->
    <div class="style-tab-content" id="tab-advanced">
        <div class="style-row">
            <label>Text Color</label>
            <input type="color" id="styleTextColor" value="#000000">
        </div>
        <div class="style-row">
            <label>Font Size</label>
            <select id="styleFontSize">
                <option value="">Default</option>
                <option value="xs">Extra Small</option>
                <option value="sm">Small</option>
                <option value="md">Medium</option>
                <option value="lg">Large</option>
                <option value="xl">Extra Large</option>
            </select>
        </div>
        <div class="style-row">
            <label>Text Align</label>
            <select id="styleTextAlign">
                <option value="">Default</option>
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="style-row">
            <label>Opacity</label>
            <input type="range" id="styleOpacity" min="10" max="100" value="100">
            <span id="styleOpacityValue">100%</span>
        </div>
        <div class="style-row">
            <label>Custom CSS Class</label>
            <input type="text" id="styleCustomClass" placeholder="e.g. my-class">
        </div>
    </div>

    <button class="diagram-btn" id="applyBlockStyle" style="width: 100%; margin-top: 12px;">Apply Style</button>
</div>

<!-- Connection Style Panel -->
<div class="block-style-panel" id="connectionPanel">
    <h4>Connection Style</h4>

    <!-- Presets section -->
    <div class="connection-presets">
        <button class="connection-preset active" data-preset="default" title="Standard">
            <i class="fas fa-arrow-right"></i>
        </button>
        <button class="connection-preset" data-preset="dashed" title="Dashed">
            <i class="fas fa-ellipsis"></i>
        </button>
        <button class="connection-preset" data-preset="curved" title="Curved">
            <i class="fas fa-bezier-curve"></i>
        </button>
        <button class="connection-preset" data-preset="double" title="Bidirectional">
            <i class="fas fa-arrows-left-right"></i>
        </button>
        <button class="connection-preset" data-preset="inheritance" title="Inheritance (UML)">
            <i class="fas fa-sitemap"></i>
        </button>
        <button class="connection-preset" data-preset="composition" title="Composition (UML)">
            <i class="fas fa-diamond"></i>
        </button>
    </div>

    <div class="style-section-label">Connector</div>
    <div class="style-row">
        <label>Type</label>
        <select id="connectorType">
            <option value="Flowchart">Flowchart (Angled)</option>
            <option value="Bezier">Bezier (Curved)</option>
            <option value="Straight">Straight</option>
            <option value="StateMachine">State Machine</option>
        </select>
    </div>

    <div class="style-row">
        <label>Color</label>
        <div class="color-presets">
            <input type="color" id="connectorColor" value="#516077">
            <button class="color-preset" data-color="#516077" title="Default"></button>
            <button class="color-preset" data-color="#dc3545" title="Red"></button>
            <button class="color-preset" data-color="#28a745" title="Green"></button>
            <button class="color-preset" data-color="#007bff" title="Blue"></button>
            <button class="color-preset" data-color="#ffc107" title="Yellow"></button>
        </div>
    </div>

    <div class="style-row">
        <label>Width</label>
        <input type="range" id="connectorWidth" min="1" max="6" value="2">
        <span id="connectorWidthValue">2px</span>
    </div>

    <div class="style-section-label">Line Style</div>
    <div class="style-row">
        <label>Pattern</label>
        <select id="connectorDashStyle">
            <option value="">Solid</option>
            <option value="4 2">Dashed</option>
            <option value="1 3">Dotted</option>
            <option value="8 4 2 4">Dash-Dot</option>
        </select>
    </div>

    <div class="style-row">
        <label>Corner Radius</label>
        <input type="range" id="connectorCornerRadius" min="0" max="20" value="5">
        <span id="connectorCornerRadiusValue">5px</span>
    </div>

    <div class="style-section-label">Anchors</div>
    <div class="style-row">
        <label>Source</label>
        <select id="connectorSourceAnchor">
            <option value="Continuous">Auto</option>
            <option value="Top">Top</option>
            <option value="Bottom">Bottom</option>
            <option value="Left">Left</option>
            <option value="Right">Right</option>
            <option value="TopLeft">Top Left</option>
            <option value="TopRight">Top Right</option>
            <option value="BottomLeft">Bottom Left</option>
            <option value="BottomRight">Bottom Right</option>
            <option value="Center">Center</option>
        </select>
    </div>
    <div class="style-row">
        <label>Target</label>
        <select id="connectorTargetAnchor">
            <option value="Continuous">Auto</option>
            <option value="Top">Top</option>
            <option value="Bottom">Bottom</option>
            <option value="Left">Left</option>
            <option value="Right">Right</option>
            <option value="TopLeft">Top Left</option>
            <option value="TopRight">Top Right</option>
            <option value="BottomLeft">Bottom Left</option>
            <option value="BottomRight">Bottom Right</option>
            <option value="Center">Center</option>
        </select>
    </div>

    <div class="style-section-label">Arrows</div>
    <div class="style-row checkbox-row">
        <label>
            <input type="checkbox" id="connectorArrowStart">
            Arrow at Start
        </label>
    </div>
    <div class="style-row checkbox-row">
        <label>
            <input type="checkbox" id="connectorArrowEnd" checked>
            Arrow at End
        </label>
    </div>
    <div class="style-row">
        <label>Arrow Style</label>
        <select id="connectorArrowStyle">
            <option value="arrow">Arrow</option>
            <option value="diamond">Diamond</option>
            <option value="disc">Disc</option>
            <option value="square">Square</option>
            <option value="hollow-arrow">Hollow Arrow</option>
            <option value="hollow-diamond">Hollow Diamond</option>
        </select>
    </div>

    <div class="style-section-label">Label</div>
    <div class="style-row">
        <input type="text" id="connectorLabel" placeholder="Connection label..." style="width: 100%;">
    </div>

    <button class="diagram-btn" id="createConnection" style="width: 100%; margin-top: 12px;">
        <i class="fas fa-plus"></i> Create Connection
    </button>
</div>

<!-- Fullscreen chat container - React will mount here -->
<div id="fullscreen-chat-root"></div>

<!-- Version info -->
<div id="app-version" style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#999;font-family:monospace;z-index:1;pointer-events:none;"></div>

</body>
</html>
